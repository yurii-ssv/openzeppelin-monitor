---
# Ports `8081` for metrics server.
#
# Config: render the tracked templates first, `deploy/render.sh --out config`
# (CP3 adds the runbook); `./config` is mounted read-only. Secrets and RPC endpoints are never in the
# files: the rendered config refers to the environment variables passed through below, which come
# from the shell or an untracked `.env` (names listed in `.env.example`).
# Data: `./data` (override with MONITOR_DATA_DIR) is persistent: the Monitor's last processed block
# and the failed-tx inbox (`data/inbox/failed-tx.jsonl`, read by the worker) live there.

services:
  monitor:
    image: openzeppelin/openzeppelin-monitor:latest
    build:
      context: .
      dockerfile: ${DOCKERFILE:-Dockerfile.development}
    environment:
      METRICS_PORT: ${METRICS_PORT:-8081}
      METRICS_ENABLED: ${METRICS_ENABLED:-false}
      # Options: trace, debug, info, warn, error
      # Default: info
      LOG_LEVEL: ${RUST_LOG:-info}
      # Options: stdout, file
      # Default: stdout
      LOG_MODE: ${LOG_MODE:-stdout}
      # Only used if LOG_MODE is file
      # Default: 1GB (1073741824 bytes)
      LOG_MAX_SIZE: ${LOG_MAX_SIZE:-1073741824}
      IN_DOCKER: 'true'
      # Pass-through (no value): defined only when set in the shell or `.env`.
      MAINNET_RPC_URL:
      MAINNET_RPC_URL_2:
      TELEGRAM_TOKEN:
      DISCORD_WEBHOOK_INFO:
      DISCORD_WEBHOOK_CLUSTER_FAILED:
      DISCORD_WEBHOOK_CLUSTER_SUCCESS:
      DISCORD_WEBHOOK_DAO_FAILED:
      DISCORD_WEBHOOK_DAO_SAFE_FAILED:
      DISCORD_WEBHOOK_DAO_SUCCESS:
      DISCORD_WEBHOOK_LARGE_ETH_TRANSFER:
      DISCORD_WEBHOOK_LIQUIDATION_FAILED:
      DISCORD_WEBHOOK_LIQUIDATION_SUCCESS:
      DISCORD_WEBHOOK_OPERATOR_FAILED:
      DISCORD_WEBHOOK_OPERATOR_SUCCESS:
      DISCORD_WEBHOOK_ORACLE_DISSENT:
      DISCORD_WEBHOOK_ORACLE_FAILED:
      DISCORD_WEBHOOK_ORACLE_SUCCESS:
      DISCORD_WEBHOOK_VALIDATOR_FAILED:
      DISCORD_WEBHOOK_VALIDATOR_SUCCESS:
    restart: on-failure:5
    mem_swappiness: 0
    security_opt:
      - no-new-privileges
    volumes:
      - ./config:/app/config/:ro
      - ${MONITOR_DATA_DIR:-./data}:/app/data
      - ${LOG_DATA_DIR:-./logs}:/app/logs
    networks:
      - monitor-network
      - metrics-network

  prometheus:
    image: prom/prometheus:v3.1.0
    security_opt:
      - no-new-privileges
    command: --log.level=warn --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/prometheus
      --storage.tsdb.retention.time=30d
    ports:
      - 9090:9090/tcp
    networks:
      - metrics-network
      - monitor-network
    volumes:
      - ./cmd/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    restart: on-failure:5
    profiles:
      - metrics

  grafana:
    image: grafana/grafana:11.5.1
    security_opt:
      - no-new-privileges
    ports: [3000:3000/tcp]
    networks:
      - metrics-network
      - monitor-network
    volumes:
      - ./cmd/prometheus/grafana.ini:/etc/grafana/grafana.ini
      - ./cmd/prometheus/datasources:/etc/grafana/provisioning/datasources
      - ./cmd/prometheus/dashboards:/etc/grafana/provisioning/dashboards
    restart: on-failure:5
    profiles:
      - metrics

networks:
  metrics-network:
    internal: true
  monitor-network:
    driver: bridge
