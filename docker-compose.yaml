---
# Ports `8081` for metrics server.
#
# Config: render the tracked templates first, `deploy/render.sh --out config` (runbook: deploy/README.md);
# `./config` (override with MONITOR_CONFIG_DIR, e.g. ./.local-dry/config for a local run) is mounted
# read-only. Secrets and RPC endpoints are never in the files: the rendered config refers to the
# environment variables passed through below, which come from the shell or an untracked `.env` (names
# listed in `.env.example`).
# Data: the named volume `monitor-data` (D18) is persistent: the Monitor's last processed block and the
# failed-tx inbox (`inbox/failed-tx.jsonl`, read by the worker of docker-compose.reconcile.yaml) live there.

services:
  monitor:
    image: openzeppelin/openzeppelin-monitor:latest
    build:
      context: .
      # Dockerfile.production: release build with a jq that runs (CP3: the development image's pinned base has glibc
      # 2.42 while its unpinned jq needs 2.43+, so every script trigger, the failed-tx inbox bridge included, fails)
      dockerfile: ${DOCKERFILE:-Dockerfile.production}
    environment:
      METRICS_PORT: ${METRICS_PORT:-8081}
      METRICS_ENABLED: ${METRICS_ENABLED:-false}
      # Options: trace, debug, info, warn, error
      # Default: info
      LOG_LEVEL: ${RUST_LOG:-info}
      # Options: stdout, file
      # Default: stdout
      LOG_MODE: ${LOG_MODE:-stdout}
      # Only used if LOG_MODE is file
      # Default: 1GB (1073741824 bytes)
      LOG_MAX_SIZE: ${LOG_MAX_SIZE:-1073741824}
      IN_DOCKER: 'true'
      # Pass-through (no value): defined only when set in the shell or `.env`.
      MAINNET_RPC_URL:
      MAINNET_RPC_URL_2:
      TELEGRAM_TOKEN:
      DISCORD_WEBHOOK_INFO:
      DISCORD_WEBHOOK_CLUSTER_FAILED:
      DISCORD_WEBHOOK_DAO_FAILED:
      DISCORD_WEBHOOK_DAO_SAFE_FAILED:
      DISCORD_WEBHOOK_LARGE_ETH_TRANSFER:
      DISCORD_WEBHOOK_LIQUIDATION_FAILED:
      DISCORD_WEBHOOK_OPERATOR_FAILED:
      DISCORD_WEBHOOK_ORACLE_DISSENT:
      DISCORD_WEBHOOK_ORACLE_FAILED:
      DISCORD_WEBHOOK_VALIDATOR_FAILED:
    restart: on-failure:5
    mem_swappiness: 0
    security_opt:
      - no-new-privileges
    volumes:
      - ${MONITOR_CONFIG_DIR:-./config}:/app/config/:ro
      - monitor-data:/app/data
      - ${LOG_DATA_DIR:-./logs}:/app/logs
    networks:
      - monitor-network
      - metrics-network

  prometheus:
    image: prom/prometheus:v3.1.0
    security_opt:
      - no-new-privileges
    command: --log.level=warn --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/prometheus
      --storage.tsdb.retention.time=30d
    ports:
      - 9090:9090/tcp
    networks:
      - metrics-network
      - monitor-network
    volumes:
      - ./cmd/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    restart: on-failure:5
    profiles:
      - metrics

  grafana:
    image: grafana/grafana:11.5.1
    security_opt:
      - no-new-privileges
    ports: [3000:3000/tcp]
    networks:
      - metrics-network
      - monitor-network
    volumes:
      - ./cmd/prometheus/grafana.ini:/etc/grafana/grafana.ini
      - ./cmd/prometheus/datasources:/etc/grafana/provisioning/datasources
      - ./cmd/prometheus/dashboards:/etc/grafana/provisioning/dashboards
    restart: on-failure:5
    profiles:
      - metrics

networks:
  metrics-network:
    internal: true
  monitor-network:
    driver: bridge

volumes:
  # The Monitor's data dir (last processed block, failed-tx inbox). Shared read-only with the worker.
  monitor-data: {}
