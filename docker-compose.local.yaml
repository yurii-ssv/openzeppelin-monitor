---
# Local Docker run against the config generated by `scripts/local-dry-run.sh --prepare`.
# Alerts only go to the TEST_* channels from ./.env; nothing is sent to the production ones.
#
#   scripts/local-dry-run.sh --prepare
#   docker compose -f docker-compose.local.yaml up --build

services:
  monitor:
    image: ssv-network-monitor:local
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile.production
    environment:
      LOG_LEVEL: ${RUST_LOG:-info}
      LOG_MODE: stdout
      METRICS_ENABLED: 'false'
      IN_DOCKER: 'true'
      # Resolved at runtime by the generated triggers ({"type": "environment", ...}).
      TEST_TELEGRAM_TOKEN: ${TEST_TELEGRAM_TOKEN:-}
      TEST_DISCORD_WEBHOOK: ${TEST_DISCORD_WEBHOOK:-}
    restart: on-failure:5
    healthcheck:  # as in docker-compose.yaml: a Monitor cycle succeeded in the last 5 min (D20)
      test: ["CMD", "python3", "-c", "import os,sys,time; sys.exit(0 if time.time()-os.stat('/app/data/evm_ethereum_mainnet_last_block.txt').st_mtime < 300 else 1)"]
      interval: 60s
      timeout: 5s
      retries: 2
      start_period: 3m
    security_opt:
      - no-new-privileges
    volumes:
      - ./.local-dry/config:/app/config/:ro
      # the same named data volume as docker-compose.yaml (D18): the worker reads its inbox/ read-only
      - monitor-data:/app/data
      - ./.local-dry/logs:/app/logs

volumes:
  monitor-data: {}
