---
# Local Docker run against the config generated by `scripts/local-dry-run.sh --prepare`.
# Alerts only go to the TEST_* channels from ./.env; nothing is sent to the production ones.
#
#   scripts/local-dry-run.sh --prepare
#   docker compose -f docker-compose.local.yaml up --build

services:
  monitor:
    image: ssv-network-monitor:local
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile.production
    environment:
      LOG_LEVEL: ${RUST_LOG:-info}
      LOG_MODE: stdout
      METRICS_ENABLED: 'false'
      IN_DOCKER: 'true'
      # Resolved at runtime by the generated triggers ({"type": "environment", ...}).
      TEST_TELEGRAM_TOKEN: ${TEST_TELEGRAM_TOKEN:-}
      TEST_DISCORD_WEBHOOK: ${TEST_DISCORD_WEBHOOK:-}
    restart: on-failure:5
    security_opt:
      - no-new-privileges
    volumes:
      - ./.local-dry/config:/app/config/:ro
      - ./.local-dry/data:/app/data
      - ./.local-dry/logs:/app/logs
