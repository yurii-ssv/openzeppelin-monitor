# `ruff check reconcile` (plan §7 V1B.2). The classic rule set (E4, E7, E9, F) plus import order, named
# explicitly so a ruff upgrade does not change what the gate checks.
line-length = 120
target-version = "py312"

[lint]
select = ["E4", "E7", "E9", "F", "I"]

[lint.isort]
known-first-party = ["alerts", "checks", "db", "eb_events", "eb_model", "eb_reconcile", "eb_storage", "inbox",
                     "inventory", "metrics", "notify", "params", "rpc"]

[lint.per-file-ignores]
# Registration lines stay in per-lane blocks so wave-2 merges are textual.
"checks/__init__.py" = ["I001"]
